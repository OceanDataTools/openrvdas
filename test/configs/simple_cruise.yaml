###########################################################
###########################################################
# YAML cruise definition file for OpenRVDAS.
#
# Created by:
#   command:  <<command_line>>
#   time:     <<date_time>> UTC
#   user:     <<user>>
#
###########################################################
cruise:
  id: <<cruise>>
  start: '<<cruise_start>>'
  end: '<<cruise_end>>'

###########################################################
includes:
  - contrib/logger_templates/serial_logger_template.yaml
  - contrib/logger_templates/parse_data_logger_template.yaml

###########################################################
# Global variables - can be overridden by individual loggers
variables:
  cruise: NBP1406
  cruise_start: '2019-07-01'
  cruise_end: '2019-12-31'

  udp_destination: 255.255.255.255
  raw_udp_port: 6224
  parsed_udp_port: 6225

  # Sample data is written under /var/tmp so it is clearly disposable: on most
  # Linux distributions systemd-tmpfiles removes anything in /var/tmp that has
  # gone untouched for 30 days. That is what you want for a demo, and emphatically
  # not what you want for a cruise - data would vanish weeks later, silently.
  #
  # Before using this file as a template for a real deployment, point file_root
  # at a location intended to hold data, e.g.
  #
  #   file_root: /var/data/openrvdas
  #
  # OpenRVDAS creates the per-logger subdirectories beneath file_root itself, but
  # it cannot create the root: that lives somewhere only root can write. Create it
  # once, owned by the user the loggers run as:
  #
  #   sudo mkdir -p /var/data/openrvdas
  #   sudo chown rvdas:rvdas /var/data/openrvdas
  #
  # (No such step is needed for /var/tmp, which is world-writable - which is why
  # these samples run with no setup.)
  file_root: /var/tmp/log
  parse_definition_path: test/NBP1406/devices/nbp_devices.yaml

  data_server: localhost:8766
  influx_bucket_name: openrvdas

###########################################################
loggers:
  gp02:
    logger_template: serial_logger_template
    variables:
      serial_port: /tmp/tty_gp02
      baud_rate: 4800
  gyr1:
    logger_template: serial_logger_template
    variables:
      serial_port: /tmp/tty_gyr1
      baud_rate: 4800

  # Parse raw UDP data and send to CDS, and optionally InfluxDB;
  # uses default global variables
  parse_data:
    logger_template: parse_data_logger_template

###########################################################
modes:
  'off':  # without a 'default_mode' key, first defined mode will be default
    [gp02-off, gyr1-off, parse_data-off]

  no_write:
    [gp02-net, gyr1-net, parse_data-on]

  write:
    [gp02-net+file, gyr1-net+file, parse_data-on]

  no_write+influx:
    [gp02-net, gyr1-net, parse_data-on+influx]

  write+influx:
    [gp02-net+file, gyr1-net+file, parse_data-on+influx]
