name: Shell Checks

# Nothing else in CI touches the shell scripts, and install_openrvdas.sh is
# both the highest-churn file in the repo and the first thing every user runs.
# See issue #638.

on:
  push:
    branches: [dev]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-checks.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-checks.yml'

jobs:
  # Parse every script under both bash versions we support. The MacOS runner
  # is the point of this job: it ships bash 3.2, which rejects constructs that
  # bash 5 accepts - a heredoc containing ';;' inside a command substitution,
  # for one. Such a construct authored on Linux passes review and then breaks
  # every MacOS install. See OPERATIONS.md, "install_openrvdas.sh - platform
  # constraints".
  syntax:
    name: bash -n (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      # /bin/bash explicitly, not whatever 'bash' resolves to on PATH: the
      # MacOS runners also carry a newer Homebrew bash, and checking that one
      # would defeat the purpose of this job.
      - name: Report bash version
        run: /bin/bash --version | head -1

      - name: Syntax-check every shell script
        run: |
          status=0
          while IFS= read -r f; do
            if /bin/bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < <(git ls-files '*.sh' | grep -v '^local/' | grep -v '^utils/deprecated/')
          exit $status

  duplicate-functions:
    name: No duplicate function definitions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # ShellCheck has no check for redefined functions, and bash accepts a
      # redefinition silently, so this needs its own check. Issue #615 shipped
      # two setup_ufw definitions in install_openrvdas.sh.
      - name: Check for duplicate function definitions
        run: bash scripts/check_duplicate_functions.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Report ShellCheck version
        run: shellcheck --version

      # Blocking gate: errors only. These are genuine defects rather than
      # style, and the tree is expected to be clean of them.
      - name: ShellCheck (severity=error, blocking)
        run: |
          # shellcheck disable=SC2046
          shellcheck --severity=error --external-sources \
            $(git ls-files '*.sh' | grep -v '^local/' | grep -v '^utils/deprecated/')

      # Informational: the full warning/info/style set. Not a gate yet - the
      # tree carries a backlog of 465 of these as of this workflow landing
      # (37 warning, 428 note; dominated by SC2086 unquoted expansions x272,
      # SC2006 backticks x86, SC2162 read-without-r x60). The intent per issue
      # #638 is to work that count down and then raise the blocking severity,
      # rather than fix them all in one change.
      - name: ShellCheck (all severities, informational)
        continue-on-error: true
        run: |
          # shellcheck disable=SC2046
          shellcheck --severity=style --external-sources \
            $(git ls-files '*.sh' | grep -v '^local/' | grep -v '^utils/deprecated/') \
            | tee shellcheck-full.txt
          echo
          echo "Total findings: $(grep -c '^In ' shellcheck-full.txt || true)"
