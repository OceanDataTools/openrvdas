################################################################################
# NMEA 0183 Standard and Proprietary Sentence Definitions
#
# The definitions are in logger/devices/nmea_0183/, one file per kind of device
# (GPS, GPS/INS, MRU, depth, ...). This file includes them all, so a
# definition_path or includes entry naming NMEA_0183.yaml gets every device
# type. To load only some, name the individual files instead - but not both,
# or each device type is loaded twice.
#
# See logger/devices/nmea_0183/README.md for the device types, the format types
# their sentences use, and the signed-position (*_Signed) variants.
################################################################################
includes:
  - logger/devices/nmea_0183/*.yaml
