###################
# serial_logger_template, built from config templates: each of its configs
# is a config template from contrib/config_templates/
# serial_reader_config_template.yaml, which a cruise definition must include
# too. It defines the same logger template as serial_logger_template.yaml,
# so include one or the other, not both. See
# test/NBP1406/NBP1406_cruise_config_templates.yaml for an example.
###################
logger_templates:
  #################
  serial_logger_template:
    configs:
      'off': {}
      net:
        config_template: serial_net_config_template
        variables:
          baud_rate: <<baud_rate|9600>>
          serial_port: <<serial_port>>
          raw_udp_port: <<raw_udp_port>>
          udp_destination: <<udp_destination>>
      net+file:
        config_template: serial_net_file_config_template
        variables:
          baud_rate: <<baud_rate|9600>>
          serial_port: <<serial_port>>
          raw_udp_port: <<raw_udp_port>>
          udp_destination: <<udp_destination>>
