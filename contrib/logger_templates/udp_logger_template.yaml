###############################################################################
# UDP logger: reads records from a UDP port, timestamps them, prefixes them
# with the logger name and rebroadcasts them on <<raw_udp_port>>; the
# net+file config also writes them to a log file.
#
# Variables:
#   reader_udp_port  UDP port to read from
#   udp_eol          optional; for sources that send several records in one
#                    packet, the separator to split packets at, e.g. "\r\n".
#                    Records from one packet share a timestamp. By default
#                    each packet is a single record.
#
# Expects these globals, as used elsewhere in the cruise definition:
#   <<raw_udp_port>>, <<udp_destination>>, <<file_root>>, <<cruise>>
###############################################################################

# Default values for this template's optional variables. Files listed under
# "includes:" are merged underneath the cruise definition, so a cruise
# definition, or an individual logger, can override these.
variables:
  udp_eol: null

###################
logger_templates:
  #################
  udp_logger_template:
    configs:
      'off': {}
      net:
        readers:
        - class: UDPReader
          kwargs:
            port: <<reader_udp_port>>
            eol: <<udp_eol>>
        transforms:
        - class: TimestampTransform
        - class: PrefixTransform
          kwargs:
            prefix: <<logger>>
        writers:
        - class: UDPWriter
          kwargs:
            port: <<raw_udp_port>>
            destination: <<udp_destination>>
      net+file:
        readers:
        - class: UDPReader
          kwargs:
            port: <<reader_udp_port>>
            eol: <<udp_eol>>
        transforms:
        - class: TimestampTransform
          mirror_to:
            class: LogfileWriter
            kwargs:
              filebase: <<file_root>>/<<logger>>/raw/<<cruise>>_<<logger>>
        - class: PrefixTransform
          kwargs:
            prefix: <<logger>>
        writers:
        - class: UDPWriter
          kwargs:
            port: <<raw_udp_port>>
            destination: <<udp_destination>>
