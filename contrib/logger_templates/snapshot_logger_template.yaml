###############################################################################
###############################################################################
##                                                                           ##
##   HISTORICAL SPECIAL CASE - DO NOT USE FOR NEW CRUISE DEFINITIONS.        ##
##                                                                           ##
##   Use averaging_logger_template.yaml in this directory instead.           ##
##                                                                           ##
###############################################################################
###############################################################################
#
# This template was written for the NB Palmer, and averages a fixed set of
# its field names (MwxAirTemp, RTMPTemp, PortTrueWindDir, KnudDepthHF and so
# on). Only the fields it *reads* come from the snapshot_fields variable, so
# pointed at any other ship's fields it reads them but averages nothing.
#
# averaging_logger_template.yaml does the same job with the fields to average
# given as variables (average_fields and direction_fields), and works for any
# ship. To switch, include that file instead of this one, change
# "logger_template: snapshot_logger_template" to
# "logger_template: averaging_logger_template", and add the two variables
# alongside snapshot_fields.
#
# This file is kept, unchanged, only so that existing cruise definitions that
# use it keep working.
###############################################################################
logger_templates:
  #################
  snapshot_logger_template:
    configs:
      'off': {}

      'on': &snapshot_on
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<data_server>>
            subscription:
              fields: <<snapshot_fields>>
        transforms:
        - class: InterpolationTransform
          module: logger.transforms.interpolation_transform
          kwargs:
            interval: <<interval>>
            window: <<window>>
            data_id: <<logger>>
            metadata_interval: 60  # send metadata every 60 seconds
            field_spec: [
              # These fields we do a simple boxcar average on
              { sources: [MwxAirTemp, RTMPTemp,PortTrueWindSpeed, StbdTrueWindSpeed,
                          MwxBarometer, KnudDepthHF, KnudDepthLF, Grv1Value],
                algorithm: boxcar_average,
                window: <<window>>,
                result_prefix: Avg  # Prefix each field name with this for output
            },
              # These fields we do a polar average on
              { sources: [PortTrueWindDir, StbdTrueWindDir],
                algorithm: polar_average,
                window: <<window>>,
                result_prefix: Avg  # Prefix each field name with this for output
              }
            ]
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<data_server>>

      on+influx:
        <<: *snapshot_on
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<data_server>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influx_bucket_name>>
