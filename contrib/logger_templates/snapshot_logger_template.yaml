###############################################################################
# Snapshot logger: reads fields from the CachedDataServer, averages them over
# a window, and writes the averages back (and optionally to InfluxDB), each
# named with an "Avg" prefix.
#
# Variables:
#   snapshot_fields   every field to read: average_fields and direction_fields
#                     together (a template can't combine two lists itself)
#   average_fields    fields to average with a simple boxcar average
#   direction_fields  angles in degrees, averaged as directions (polar
#                     average), so that 359 and 1 average to 0, not 180.
#                     Use [] if there are none.
#   interval          how often to output averages, in seconds
#   window            how many seconds of data to average over
#
# Expects these globals, as used elsewhere in the cruise definition:
#   <<data_server>>, <<influx_bucket_name>>
#
# Example:
#
#   snapshot:
#     logger_template: snapshot_logger_template
#     variables:
#       snapshot_fields: [AirTemp, WindSpeed, WindDir]
#       average_fields: [AirTemp, WindSpeed]
#       direction_fields: [WindDir]
#       interval: 30
#       window: 30
###############################################################################
logger_templates:
  #################
  snapshot_logger_template:
    configs:
      'off': {}

      'on': &snapshot_on
        readers:
        - class: CachedDataReader
          kwargs:
            data_server: <<data_server>>
            subscription:
              fields: <<snapshot_fields>>
        transforms:
        - class: InterpolationTransform
          module: logger.transforms.interpolation_transform
          kwargs:
            interval: <<interval>>
            window: <<window>>
            data_id: <<logger>>
            metadata_interval: 60  # send metadata every 60 seconds
            field_spec:
            # These fields we do a simple boxcar average on
            - sources: <<average_fields>>
              algorithm: boxcar_average
              window: <<window>>
              result_prefix: Avg  # Prefix each field name with this for output
            # These fields we do a polar average on
            - sources: <<direction_fields>>
              algorithm: polar_average
              window: <<window>>
              result_prefix: Avg  # Prefix each field name with this for output
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<data_server>>

      on+influx:
        <<: *snapshot_on
        writers:
        - class: CachedDataWriter
          kwargs:
            data_server: <<data_server>>
        - class: InfluxDBWriter
          kwargs:
            bucket_name: <<influx_bucket_name>>
